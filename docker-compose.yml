services:
  server:
    build: .
    ports:
      - "5000:5000"
    environment:
      - ENV=DEV
    volumes:
      - .:/app

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite
    restart: unless-stopped
    ports:
      - "10000:10000" # Blob service
      - "10001:10001" # Queue service
      - "10002:10002" # Table service
    volumes:
      - azurite_data:/data
    command: >
      azurite
        --blobHost 0.0.0.0
        --queueHost 0.0.0.0
        --tableHost 0.0.0.0
        --loose
        --location /data

volumes:
  azurite_data: